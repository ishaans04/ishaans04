name: Refresh mission control

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_activity.py
      - scripts/render_activity.py
      - .github/workflows/activity.yml

concurrency:
  group: profile-activity
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public activity and rebuild the panel
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ishaans04
        run: |
          python -m unittest discover -s scripts -p 'test_activity.py'
          python scripts/update_activity.py
      - name: Rebuild the education panel (time enrolled moves daily)
        continue-on-error: true
        run: |
          python -m unittest discover -s scripts -p 'test_record.py'
          python scripts/build_record.py
      - name: Commit changed panel
        run: |
          git config user.name 'ishaans04'
          git config user.email '277194574+ishaans04@users.noreply.github.com'
          git add assets/activity-night.svg assets/activity-day.svg assets/skyline-night.svg assets/skyline-day.svg assets/divider-*.svg assets/activity.json assets/about-*.svg assets/internship-*.svg assets/education-*.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh activity panel"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
