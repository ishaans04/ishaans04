name: Refresh mission control

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_activity.py
      - .github/workflows/activity.yml

concurrency:
  group: profile-activity
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public activity and rebuild dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ishaans04
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/update_activity.py
      - name: Commit changed dashboard
        run: |
          git config user.name 'ishaans04'
          git config user.email '277194574+ishaans04@users.noreply.github.com'
          git add assets/activity.svg assets/activity.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh contribution mission control"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
