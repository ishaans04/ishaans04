 d="M151 153 Q179 127 210 136" fill="none" stroke="#ff94a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g></g></g><text x="365" y="63" font-size="17" fill="#85baff" font-weight="600" class="mono" letter-spacing="3">02 / CAPTAIN AMERICA</text><text x="362" y="133" font-size="58" fill="#edf4ff" font-weight="750" class="sans" letter-spacing="-2">Built with a purpose.</text><text x="365" y="179" font-size="24" fill="#9aaec4" font-weight="400" class="sans" >Four pinned projects. One clear standard: show the work.</text><text x="365" y="230" font-size="14" fill="#607b95" font-weight="400" class="mono" letter-spacing="2">ISHAANS04  /  AVENGERS INITIATIVE</text><text x="1107" y="88" font-size="68" fill="#22354a" font-weight="800" class="sans" text-anchor="middle">02</text></svg>