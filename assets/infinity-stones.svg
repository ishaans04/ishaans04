<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title"><title id="title">Six Infinity Stones: Connect, Reason, Verify, Engineer, Recover, Design.</title><defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset=".55" stop-color="#0b1422"/><stop offset="1" stop-color="#080e19"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#b898ee" stop-opacity=".17"/><stop offset="1" stop-color="#b898ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#56718d" stroke-opacity=".08"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
    </defs><style>
.sans{font-family:'Segoe UI',Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}
.arrival{animation:arrival 10s ease-in-out infinite}.name{animation:reveal 10s ease-in-out infinite}
.bolt{animation:bolt 10s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite}
.reactor{animation:reactor 3s ease-in-out infinite}.exhaust{animation:exhaust .8s ease-in-out infinite;transform-origin:120px 310px}
.shield{transform-origin:196px 191px;animation:shield 7s ease-in-out infinite}
.smash{animation:smash 7s ease-in-out infinite;transform-origin:110px 300px}
.smash-fist{animation:punch 7s ease-in-out infinite;transform-origin:40px 170px}
.impact{animation:impact 7s ease-out infinite;transform-origin:65px 307px}
.hang{animation:hang 6s ease-in-out infinite;transform-origin:144px 0}
.deploy{animation:deploy 9s ease-in-out infinite}
.stone{animation:stone 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.orbit{animation:orbit 24s linear infinite;transform-origin:190px 225px}
@keyframes arrival{0%{transform:translateY(-35px);opacity:0}8%,95%{transform:translateY(0);opacity:1}100%{opacity:0}}
@keyframes reveal{0%,6%{opacity:0;transform:translateY(10px)}16%,96%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes bolt{0%,5%{opacity:0}8%{opacity:.95}19%,100%{opacity:0}}
@keyframes drift{50%{transform:translateY(-7px)}}
@keyframes deploy{0%{opacity:.55;transform:translate(-25px,10px)}12%,92%{opacity:1;transform:translate(0,0)}100%{opacity:.55;transform:translate(8px,-6px)}}
@keyframes reactor{50%{opacity:.5}}
@keyframes exhaust{50%{transform:scaleY(.7);opacity:.6}}
@keyframes shield{0%,65%,100%{transform:rotate(0)}80%{transform:rotate(-20deg)}90%{transform:rotate(14deg)}}
@keyframes smash{0%,45%,100%{transform:translateY(0)}52%{transform:translateY(-12px)}60%{transform:translateY(5px)}70%{transform:translateY(0)}}
@keyframes punch{0%,45%,100%{transform:rotate(0)}52%{transform:rotate(18deg)}60%{transform:rotate(-8deg)}70%{transform:rotate(0)}}
@keyframes impact{0%,56%,80%,100%{opacity:0}60%{opacity:1}75%{opacity:0}}
@keyframes hang{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes stone{50%{transform:translateY(-5px);opacity:.7}}
@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.bolt,.impact{opacity:0}}
</style><rect x="1" y="1" width="1198" height="268" rx="20" fill="url(#bg)" stroke="#22334a" /><rect x="1" y="1" width="1198" height="268" rx="20" fill="url(#grid)" stroke="none" /><ellipse cx="178" cy="135.0" rx="320" ry="216.0" fill="url(#halo)"/><path d="M20 269H1180" fill="none" stroke="#b898ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".35"/><text x="42" y="47" font-size="17" fill="#b0c5dd" font-weight="600" class="mono" letter-spacing="2">SIX STONES. ONE ENGINEERING PHILOSOPHY.</text><circle cx="108" cy="110" r="34" fill="#6eacff" stroke="none" stroke-width="1" opacity=".12" filter="url(#glow)"/><g class="stone" style="animation-delay:0.0s"><path d="M108 77 129 91 126 122 108 139 90 122 87 91Z" fill="#6eacff" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><path d="M108 77 112 101 129 91 M112 101 126 122 108 139 103 109 87 91Z" fill="#fff" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" opacity=".24"/></g><text x="108" y="172" font-size="13" fill="#6eacff" font-weight="600" class="mono" text-anchor="middle" letter-spacing="2">SPACE</text><text x="108" y="205" font-size="25" fill="#edf4ff" font-weight="700" class="sans" text-anchor="middle">Connect</text><text x="108" y="235" font-size="16" fill="#9aaec4" font-weight="400" class="sans" text-anchor="middle">APIs + MCP</text><circle cx="305" cy="110" r="34" fill="#f1d46f" stroke="none" stroke-width="1" opacity=".12" filter="url(#glow)"/><g class="stone" style="animation-delay:0.5s"><path d="M305 77 326 91 323 122 305 139 287 122 284 91Z" fill="#f1d46f" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><path d="M305 77 309 101 326 91 M309 101 323 122 305 139 300 109 284 91Z" fill="#fff" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" opacity=".24"/></g><text x="305" y="172" font-size="13" fill="#f1d46f" font-weight="600" class="mono" text-anchor="middle" letter-spacing="2">MIND</text><text x="305" y="205" font-size="25" fill="#edf4ff" font-weight="700" class="sans" text-anchor="middle">Reason</text><text x="305" y="235" font-size="16" fill="#9aaec4" font-weight="400" class="sans" text-anchor="middle">Agents + RAG</text><circle cx="502" cy="110" r="34" fill="#fb7c87" stroke="none" stroke-width="1" opacity=".12" filter="url(#glow)"/><g class="stone" style="animation-delay:1.0s"><path d="M502 77 523 91 520 122 502 139 484 122 481 91Z" fill="#fb7c87" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><path d="M502 77 506 101 523 91 M506 101 520 122 502 139 497 109 481 91Z" fill="#fff" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" opacity=".24"/></g><text x="502" y="172" font-size="13" fill="#fb7c87" font-weight="600" class="mono" text-anchor="middle" letter-spacing="2">REALITY</text><text x="502" y="205" font-size="25" fill="#edf4ff" font-weight="700" class="sans" text-anchor="middle">Verify</text><text x="502" y="235" font-size="16" fill="#9aaec4" font-weight="400" class="sans" text-anchor="middle">Sources + tests</text><circle cx="699" cy="110" r="34" fill="#ba91fa" stroke="none" stroke-width="1" opacity=".12" filter="url(#glow)"/><g class="stone" style="animation-delay:1.5s"><path d="M699 77 720 91 717 122 699 139 681 122 678 91Z" fill="#ba91fa" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><path d="M699 77 703 101 720 91 M703 101 717 122 699 139 694 109 678 91Z" fill="#fff" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" opacity=".24"/></g><text x="699" y="172" font-size="13" fill="#ba91fa" font-weight="600" class="mono" text-anchor="middle" letter-spacing="2">POWER</text><text x="699" y="205" font-size="25" fill="#edf4ff" font-weight="700" class="sans" text-anchor="middle">Engineer</text><text x="699" y="235" font-size="16" fill="#9aaec4" font-weight="400" class="sans" text-anchor="middle">Systems + data</text><circle cx="896" cy="110" r="34" fill="#6cd5a0" stroke="none" stroke-width="1" opacity=".12" filter="url(#glow)"/><g class="stone" style="animation-delay:2.0s"><path d="M896 77 917 91 914 122 896 139 878 122 875 91Z" fill="#6cd5a0" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><path d="M896 77 900 101 917 91 M900 101 914 122 896 139 891 109 875 91Z" fill="#fff" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" opacity=".24"/></g><text x="896" y="172" font-size="13" fill="#6cd5a0" font-weight="600" class="mono" text-anchor="middle" letter-spacing="2">TIME</text><text x="896" y="205" font-size="25" fill="#edf4ff" font-weight="700" class="sans" text-anchor="middle">Recover</text><text x="896" y="235" font-size="16" fill="#9aaec4" font-weight="400" class="sans" text-anchor="middle">State + replay</text><circle cx="1093" cy="110" r="34" fill="#f6ad6c" stroke="none" stroke-width="1" opacity=".12" filter="url(#glow)"/><g class="stone" style="animation-delay:2.5s"><path d="M1093 77 1114 91 1111 122 1093 139 1075 122 1072 91Z" fill="#f6ad6c" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><path d="M1093 77 1097 101 1114 91 M1097 101 1111 122 1093 139 1088 109 1072 91Z" fill="#fff" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" opacity=".24"/></g><text x="1093" y="172" font-size="13" fill="#f6ad6c" font-weight="600" class="mono" text-anchor="middle" letter-spacing="2">SOUL</text><text x="1093" y="205" font-size="25" fill="#edf4ff" font-weight="700" class="sans" text-anchor="middle">Design</text><text x="1093" y="235" font-size="16" fill="#9aaec4" font-weight="400" class="sans" text-anchor="middle">People + product</text></svg>