roke-linecap="round" /></g></g><text x="365" y="63" font-size="17" fill="#9dde79" font-weight="600" class="mono" letter-spacing="3">03 / HULK</text><text x="362" y="133" font-size="58" fill="#edf4ff" font-weight="750" class="sans" letter-spacing="-2">Small commits. Big impact.</text><text x="365" y="179" font-size="24" fill="#9aaec4" font-weight="400" class="sans" >The activity behind the builds.</text><text x="365" y="230" font-size="14" fill="#607b95" font-weight="400" class="mono" letter-spacing="2">ISHAANS04  /  AVENGERS INITIATIVE</text><text x="1107" y="88" font-size="68" fill="#22354a" font-weight="800" class="sans" text-anchor="middle">03</text><g transform="translate(65 12) scale(.78)"><g class="impact"><path d="M65 307 25 299 4 313 M65 307 43 328 M65 307 100 315 118 308 M65 307 81 334" fill="none" stroke="#a9e680" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g></g></svg>