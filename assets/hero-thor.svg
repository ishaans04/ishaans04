><rect x="400" y="384" width="50" height="4" rx="2" fill="#7bddff" stroke="none" /><text x="400" y="430" font-size="31" fill="#b9eaff" font-weight="600" class="sans" >Ishaan builds AI that shows its work.</text><text x="400" y="470" font-size="23" fill="#9aaec4" font-weight="400" class="sans" >Evidence. Guardrails. Interfaces that make sense.</text></g><text x="42" y="536" font-size="13" fill="#6d8fa9" font-weight="400" class="mono" letter-spacing="2">THOR / BRING THE THUNDER</text><text x="1155" y="536" font-size="13" fill="#92b9d2" font-weight="400" class="mono" text-anchor="end" letter-spacing="2">SCROLL TO ASSEMBLE  ↓</text></svg>